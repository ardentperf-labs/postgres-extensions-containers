apiVersion: v1
kind: ConfigMap
metadata:
  name: functional-sql
data:
  functional.sql: |
    \set ON_ERROR_STOP on
    CREATE EXTENSION pltclu;
    CREATE FUNCTION tcl_add(integer, integer)
      RETURNS integer LANGUAGE pltcl AS $$return [expr {$1 + $2}]$$;
    CREATE FUNCTION tcl_trusted_hides_exec()
      RETURNS boolean LANGUAGE pltcl AS $$return [expr {[llength [info commands exec]] == 0}]$$;
    CREATE FUNCTION tcl_untrusted_exposes_exec()
      RETURNS boolean LANGUAGE pltclu AS $$return [expr {[llength [info commands exec]] > 0}]$$;
    DO $$
    BEGIN
      IF tcl_add(19, 23) IS DISTINCT FROM 42
         OR tcl_trusted_hides_exec() IS DISTINCT FROM true
         OR tcl_untrusted_exposes_exec() IS DISTINCT FROM true THEN
        RAISE EXCEPTION 'PL/Tcl arithmetic or trusted/untrusted behavior mismatch';
      END IF;
    END
    $$;
