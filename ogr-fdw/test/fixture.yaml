apiVersion: v1
kind: ConfigMap
metadata:
  name: ogr-fixture
data:
  features.geojson: |
    {
      "type": "FeatureCollection",
      "name": "features",
      "features": [
        {
          "type": "Feature",
          "properties": {"id": 42, "label": "survey marker"},
          "geometry": {"type": "Point", "coordinates": [-122.4, 37.7]}
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ogr-fixture
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ogr-fixture
  template:
    metadata:
      labels:
        app: ogr-fixture
    spec:
      containers:
      - name: nginx
        # renovate: datasource=docker depName=nginx versioning=docker
        image: nginx:1.29.1-alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: content
          mountPath: /usr/share/nginx/html
          readOnly: true
      volumes:
      - name: content
        configMap:
          name: ogr-fixture
---
apiVersion: v1
kind: Service
metadata:
  name: ogr-fixture
spec:
  selector:
    app: ogr-fixture
  ports:
  - port: 80
    targetPort: 80
