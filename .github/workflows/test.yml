name: Hosted catalog smoke validation
on: workflow_dispatch
permissions:
  contents: read
  packages: read
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        image:
          - ghcr.io/cloudnative-pg/pgrouting:4.0.2-202611231657-18-trixie@sha256:8cbc57f17cb357f9344482f0a66ce3e755b16b3522cb0933d71c59be468d20fe
          - ghcr.io/cloudnative-pg/pgrouting:4.0.2-202611231657-19-trixie@sha256:e10c2893111221df84f402e81dea68ac91fea46b0584f706ac0ad2b20e207847
    uses: ./.github/workflows/smoke.yml
    with:
      extension_name: pgrouting
      image: ${{ matrix.image }}
      cnpg_version: '1.30.2'
