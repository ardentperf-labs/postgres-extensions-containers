name: Update policy
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_run:
    workflows: [Update policy review event]
    types: [completed]
permissions: {}
jobs:
  policy:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.repository.default_branch || github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            if (context.eventName === 'workflow_run') {
              const run = context.payload.workflow_run;
              if (run.path !== '.github/workflows/update-policy-review.yml') throw new Error('Unexpected review trigger');
              if (run.pull_requests.length !== 1) throw new Error('Review trigger must identify one PR');
              const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: run.pull_requests[0].number});
              if (pr.state !== 'open') return;
              context.payload.pull_request = pr;
            }
            await require('./.github/scripts/update-policy.cjs').check({github, context, core});
