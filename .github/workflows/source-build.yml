name: Source builds
'on':
  workflow_call:
    inputs:
      pr_number:
        type: string
        required: true
      expected_sha:
        description: Authorized event head; reject a newer PR revision
        type: string
        required: true
    secrets:
      SNYK_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      validation_only:
        description: Validate one explicit PR target without reporting full PR acceptance
        type: boolean
        default: false
      expected_sha:
        description: Exact head SHA authorized for PR testing (required with pr_number)
        type: string
        default: ''
      pr_number:
        description: Optional PR number; selects changed extensions and disables production publishing
        type: string
        default: ''
      extension_name:
        description: Logical source extension name, or all
        type: string
        required: false
      cnpg_version:
        description: Optional CNPG full version or main
        type: string
        required: false
        default: ''
  # Keep the required check present on unrelated PRs and merge-queue commits.
  merge_group:
  push:
    branches: [main]
defaults:
  run:
    shell: 'bash -Eeuo pipefail -x {0}'
permissions: {}
jobs:
  discover:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Check changed files
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.get-matrix.outputs.matrix}}
      ref: ${{ steps.pr.outputs.sha }}
      base_ref: ${{ steps.pr.outputs.base_ref }}
    steps:
      - &authorize-candidate
        name: Authorize this execution attempt
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        with:
          script: |
            // Repeat in each job: rerunning a downstream job does not rerun needs.
            const prNumber = process.env.PR_NUMBER || '';
            const sha = process.env.EXPECTED_SHA || '';
            if (context.payload.inputs?.validation_only === 'true' &&
                (!prNumber || !sha || !context.payload.inputs.extension_name || context.payload.inputs.extension_name === 'all')) {
              throw new Error('Scoped validation requires an exact PR head and one explicit extension');
            }
            if (context.eventName === 'workflow_dispatch' && context.ref !== 'refs/heads/main') {
              throw new Error('Dispatch the protected main workflow');
            }
            if (Number(process.env.GITHUB_RUN_ATTEMPT) > 1 || prNumber || sha || context.eventName === 'pull_request_target' || context.eventName === 'workflow_dispatch') {
              const {data} = await github.rest.repos.getCollaboratorPermissionLevel({...context.repo, username: process.env.TRIGGERING_ACTOR});
              if (data.permission !== 'admin') throw new Error('Repository Admin permission required for this execution attempt');
            }
            if (prNumber || sha || context.eventName === 'pull_request_target') {
              if (!/^[1-9][0-9]*$/.test(prNumber) || !/^[0-9a-f]{40}$/.test(sha)) throw new Error('Expected PR number and exact head SHA');
              const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: Number(prNumber)});
              if (pr.state !== 'open' || pr.head.sha !== sha) throw new Error('PR head changed or closed; authorize the new event');
              if (context.eventName === 'pull_request_target' &&
                  (context.payload.pull_request.number !== pr.number || context.payload.pull_request.head.sha !== sha)) {
                throw new Error('Candidate must match the authorized PR event');
              }
            }
      - name: Resolve manual PR and start status
        if: inputs.pr_number != ''
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CNPG_VERSION: ${{ inputs.cnpg_version }}
        with:
          script: |
            if (!/^[1-9][0-9]*$/.test(process.env.PR_NUMBER)) throw new Error('Expected a PR number');
            const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: Number(process.env.PR_NUMBER)});
            if (pr.state !== 'open') throw new Error('PR must be open');
            if (!/^[0-9a-f]{40}$/.test(process.env.EXPECTED_SHA || '') || pr.head.sha !== process.env.EXPECTED_SHA) throw new Error('PR head changed; authorize the new event');
            core.setOutput('sha', pr.head.sha);
            core.setOutput('base', pr.base.sha);
            core.setOutput('base_ref', pr.base.ref);
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: pr.head.sha, context: ${{ inputs.validation_only && 'true' || 'false' }} ? 'Scoped Source-build acceptance' : 'Source-build acceptance', state: 'pending',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            if (process.env.CNPG_VERSION) throw new Error('PR gate reporting requires the full CNPG support matrix');

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.pr.outputs.sha }}
          fetch-depth: ${{ inputs.pr_number != '' && '0' || '1' }}
          allow-unsafe-pr-checkout: ${{ github.event_name == 'pull_request_target' }}
          persist-credentials: false

      - name: Fetch valid targets
        id: get-targets
        run: |
          python3 source-build/workflow.py --inventory > "$RUNNER_TEMP/source-inventory.json"
          echo "output=$(jq -c 'keys' "$RUNNER_TEMP/source-inventory.json")" >> "$GITHUB_OUTPUT"

      - name: Validate extension name
        if: github.event_name == 'workflow_dispatch' && (inputs.pr_number == '' || inputs.validation_only)
        env:
          INPUT_EXTENSION_NAME: ${{ github.event.inputs.extension_name }}
          VALID_TARGETS: ${{ steps.get-targets.outputs.output }}
        run: |
          if [[ "$INPUT_EXTENSION_NAME" != all ]] && ! echo "$VALID_TARGETS" | jq -e --arg ext "$INPUT_EXTENSION_NAME" 'index($ext)' > /dev/null; then
            echo "::error::'$INPUT_EXTENSION_NAME' is not a valid extension target. Use 'all' or one of: $VALID_TARGETS"
            exit 1
          fi

      - name: Compute paths-filter extensions block
        env:
          VALID_TARGETS: ${{ steps.get-targets.outputs.output }}
        run: |
          {
            echo 'EXTENSIONS<<YAML_EOF'
            jq -r 'to_entries[] | .key as $name | .value.recipe_path as $path |
              "\($name):\n  - \"\($path)/**\"\n  - \"!\($path)/test/**\"\n  - \"!\($path)/**/*.md\"\n_test_\($name):\n  - \"\($path)/test/**\""' "$RUNNER_TEMP/source-inventory.json"
            echo 'YAML_EOF'
          } >> "$GITHUB_ENV"

      - name: Resolve manual PR diff base
        if: github.event_name == 'workflow_dispatch' && inputs.pr_number != ''
        id: diff-base
        env:
          BASE_SHA: ${{ steps.pr.outputs.base }}
        run: |
          git fetch --no-tags origin "$BASE_SHA"
          echo "sha=$(git merge-base HEAD "$BASE_SHA")" >> "$GITHUB_OUTPUT"

      - name: Check for changes
        if: github.event_name != 'workflow_dispatch' || inputs.pr_number != ''
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          base: ${{ steps.diff-base.outputs.sha }}
          ref: ${{ steps.pr.outputs.sha }}
          predicate-quantifier: some-with-excludes
          filters: |
            _shared:
              - 'docker-bake.hcl'
              - 'docker-bake-source.hcl'
              - 'source-build/**'
              - '!source-build/pgrx/**'
              - '!source-build/universe/**'
              - 'scripts/**'
              - 'Taskfile.yml'
              - 'test/**'
              - 'dagger/maintenance/**'
              - '.github/workflows/**'
            _pgrx:
              - 'docker-bake-pgrx.hcl'
              - 'source-build/pgrx/**'
            _universe:
              - 'source-build/universe/**'
            ${{ env.EXTENSIONS }}

      - name: Verify selected PR revision
        if: inputs.pr_number != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          TEST_SHA: ${{ steps.pr.outputs.sha }}
        with:
          script: |
            const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: Number(process.env.PR_NUMBER)});
            if (pr.head.sha !== process.env.TEST_SHA) throw new Error('PR changed during selection; rerun for the new head');

      # Only payload changes rebuild on main; shared and test changes validate on branches.
      - name: Compute matrix
        id: get-matrix
        env:
          # JSON array containing the extensions that have been changed
          VALIDATION_ONLY: ${{ inputs.validation_only || false }}
          CHANGES: ${{ steps.filter.outputs.changes }}
          # Input Extension name
          INPUT_EXTENSION_NAME: ${{ github.event.inputs.extension_name }}
          EVENT_NAME: ${{ inputs.validation_only && 'workflow_dispatch' || (inputs.pr_number != '' && 'manual_pr' || github.event_name) }}
          SELECTION_REF: ${{ steps.pr.outputs.sha || github.ref }}
          VALID_TARGETS: ${{ steps.get-targets.outputs.output }}
          # Standard packaging and the install path with a guarded lock correction.
          INFRASTRUCTURE_SAMPLE: '["pg-durable", "pg-session-jwt"]'
        run: |
          if [[ "${EVENT_NAME}" == 'workflow_dispatch' ]]; then
            if [[ "$INPUT_EXTENSION_NAME" == all ]]; then
              CHANGES="$VALID_TARGETS"
            else
              CHANGES=$(jq -cn --arg ext "$INPUT_EXTENSION_NAME" '[$ext]')
            fi
          else
            UNIVERSE_SAMPLE=$(jq -c '[to_entries[] | select(.value.build_family == "universe") | .key]' "$RUNNER_TEMP/source-inventory.json")
            CHANGES=$(jq -ce --argjson universe "$UNIVERSE_SAMPLE" --arg ref "$SELECTION_REF" --argjson targets "$VALID_TARGETS" \
              --argjson sample "$INFRASTRUCTURE_SAMPLE" '
              . as $changes
              | (map(select(startswith("_") | not))) as $direct
              | if $ref == "refs/heads/main" then $direct
                else
                  $direct + (map(select(startswith("_test_")) | ltrimstr("_test_")))
                    + (if ($changes | index("_shared")) or ($changes | index("_pgrx")) then ($sample - ($sample - $targets)) else [] end)
                    + (if ($changes | index("_shared")) or ($changes | index("_universe")) then $universe else [] end)
                end | unique
            ' <<< "$CHANGES")
          fi

          CHANGES="$CHANGES" python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          inventory = json.loads((Path(os.environ['RUNNER_TEMP']) / 'source-inventory.json').read_text())
          selected = set(json.loads(os.environ['CHANGES']))
          if selected - inventory.keys():
              raise SystemExit('Selection contains an unknown source recipe')
          while os.environ['VALIDATION_ONLY'] != 'true':
              users = {name for name, value in inventory.items()
                       if selected.intersection(value.get('required_extensions', []))}
              if users <= selected:
                  break
              selected |= users
          matrix = [{'extension': name, 'build_family': inventory[name]['build_family']}
                    for name in sorted(selected)]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps(matrix) + '\n')
          PYTHON


  contracts:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: discover
    permissions:
      contents: read
    uses: ./.github/workflows/source-build-tests.yml
    with:
      ref: ${{ needs.discover.outputs.ref }}
  build:
    needs: [discover, contracts]
    if: ${{ needs.discover.outputs.matrix != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}
    permissions:
      pull-requests: read
      actions: read
      contents: read
      packages: write
      id-token: write
      security-events: write
    uses: ./.github/workflows/source-build-targets.yml
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    with:
      pr_number: ${{ inputs.pr_number }}
      extension_name: ${{ matrix.extension }}
      build_family: ${{ matrix.build_family }}
      ref: ${{ needs.discover.outputs.ref }}
      cnpg_version: ${{ inputs.cnpg_version }}
  gate:
    name: ${{ inputs.validation_only && 'Scoped Source-build acceptance' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'Source-build acceptance (fork preview)' || 'Source-build acceptance' }}
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs:
    - discover
    - contracts
    - build
    runs-on: ubuntu-26.04
    steps:
    - env:
        DISCOVERY: ${{ needs.discover.result }}
        CONTRACTS: ${{ needs.contracts.result }}
        BUILDS: ${{ needs.build.result }}
        MATRIX: ${{ needs.discover.outputs.matrix }}
      run: |-
        python3 - <<'PYTHON'
        import json, os
        if os.environ['DISCOVERY'] != 'success':
            raise SystemExit('Extension discovery did not succeed')
        if os.environ['CONTRACTS'] != 'success':
            raise SystemExit('Source-build tooling tests did not succeed')
        matrix = json.loads(os.environ['MATRIX'])
        if not isinstance(matrix, list) or any(not isinstance(x, dict) or x.get('build_family') not in ('pgrx', 'universe') or not x.get('extension') for x in matrix):
            raise SystemExit('Invalid extension matrix')
        expected = 'success' if matrix else 'skipped'
        if os.environ['BUILDS'] != expected:
            raise SystemExit(f"Expected builds={expected}, got {os.environ['BUILDS']}")
        PYTHON
  catalogs:
    name: Update Catalogs
    needs: [discover, gate]
    if: github.ref == 'refs/heads/main' && needs.discover.outputs.matrix != '[]' && github.event_name != 'pull_request_target' && needs.discover.outputs.ref == ''
    runs-on: ubuntu-26.04
    permissions:
      pull-requests: read
      actions: read
      contents: write
    steps:
    - *authorize-candidate
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        pattern: catalog-metadata-*
        path: ${{ runner.temp }}/catalog-metadata
    - name: Collect accepted production references
      id: accepted
      env:
        MATRIX: ${{ needs.discover.outputs.matrix }}
      run: |
        python3 - <<'PYTHON'
        import json, os, pathlib
        expected = {'catalog-metadata-' + row['extension'] for row in json.loads(os.environ['MATRIX'])}
        actual = {p.name for p in (pathlib.Path(os.environ['RUNNER_TEMP']) / 'catalog-metadata').iterdir()}
        if actual != expected:
            raise SystemExit('Missing or unexpected catalog handoff artifacts')
        PYTHON
        refs=$(jq -cs '[.[] | .[] | (."image.name" | split(",")[0] | split(":")[0] | sub("-testing$"; "")) + "@" + ."containerimage.digest"] | unique' "$RUNNER_TEMP"/catalog-metadata/*/metadata.json)
        echo "refs=$refs" >> "$GITHUB_OUTPUT"
    - name: Repository Dispatch
      uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4
      with:
        event-type: update-catalogs
        client-payload: '{"source_sha": "${{ github.sha }}", "accepted_image_refs": ${{ steps.accepted.outputs.refs }}}'

  report-pr-status:
    if: ${{ always() && needs.discover.outputs.ref != '' }}
    needs: [discover, gate]
    runs-on: ubuntu-26.04
    permissions:
      statuses: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          TEST_SHA: ${{ needs.discover.outputs.ref }}
          PASSED: ${{ needs.gate.result == 'success' }}
        with:
          script: |
            if (!/^[0-9a-f]{40}$/.test(process.env.TEST_SHA)) throw new Error('ref must be a full commit SHA');
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: process.env.TEST_SHA, context: ${{ inputs.validation_only && 'true' || 'false' }} ? 'Scoped Source-build acceptance' : 'Source-build acceptance',
              state: process.env.PASSED === 'true' ? 'success' : 'failure',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
