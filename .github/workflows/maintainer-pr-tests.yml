name: Maintainer PR tests
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions: {}
concurrency:
  group: maintainer-tests-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Trusted base workflow only; do not execute PR code before authorization.
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        with:
          script: |
            const pr = context.payload.pull_request;
            const {data: current} = await github.rest.pulls.get({...context.repo, pull_number: pr.number});
            if (current.state !== 'open' || current.head.sha !== pr.head.sha) {
              throw new Error('PR head changed; authorize the new event');
            }
            // Downstream jobs also recheck the triggering actor and head before candidate execution.
            // A project admin can explicitly authorize this event's head SHA with Re-run all jobs.
            const actors = Number(process.env.GITHUB_RUN_ATTEMPT) > 1
              ? [process.env.TRIGGERING_ACTOR]
              : [pr.user.login, context.actor, process.env.TRIGGERING_ACTOR];
            for (const username of new Set(actors)) {
              const {data} = await github.rest.repos.getCollaboratorPermissionLevel({...context.repo, username});
              if (data.permission !== 'admin') throw new Error(`${username} requires repository Admin permission`);
            }
  test:
    needs: prepare
    permissions:
      # The reusable workflow declares a catalog job with contents: write;
      # explicit refs skip that job. Discovery/build jobs retain read access.
      contents: write
      pull-requests: read
      actions: read
      statuses: write
      packages: write
      id-token: write
      security-events: write
    uses: ./.github/workflows/bake.yml
    with:
      pr_number: ${{ format('{0}', github.event.pull_request.number) }}
      expected_sha: ${{ github.event.pull_request.head.sha }}
  pgrx:
    needs: prepare
    permissions:
      # The reusable workflow declares a catalog job with contents: write;
      # explicit refs skip that job. Discovery/build jobs retain read access.
      contents: write
      pull-requests: read
      actions: read
      statuses: write
      packages: write
      id-token: write
      security-events: write
    uses: ./.github/workflows/source-build.yml
    with:
      pr_number: ${{ format('{0}', github.event.pull_request.number) }}
      expected_sha: ${{ github.event.pull_request.head.sha }}
