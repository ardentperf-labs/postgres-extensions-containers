name: Verify standard hosted extension signatures

on:
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - extension: plr
            tag: 1-8.4.8.7-202610020719-18-bookworm
          - extension: plr
            tag: 1-8.4.8.7-202610020719-18-trixie
          - extension: pgsphere
            tag: 1.5.2-202610020719-18-bookworm
          - extension: pgsphere
            tag: 1.5.2-202610020719-18-trixie
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify index signature and identity
        env:
          EXTENSION: ${{ matrix.extension }}
          TAG: ${{ matrix.tag }}
          ISSUER: https://token.actions.githubusercontent.com
          EXPECTED_IDENTITY: https://github.com/ardentperf-labs/postgres-extensions-containers/.github/workflows/bake_targets.yml@refs/heads/work/sbom-validation
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/signature-evidence/$EXTENSION/$TAG"
          mkdir -p "$output"
          image="ghcr.io/ardentperf-labs/$EXTENSION-testing:$TAG"
          digest=$(docker buildx imagetools inspect "$image" | sed -n 's/^Digest: //p' | head -n1)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          reference="$image@$digest"
          cosign verify \
            --output=json \
            --certificate-oidc-issuer "$ISSUER" \
            --certificate-identity "$EXPECTED_IDENTITY" \
            "$reference" > "$output/cosign-verification.json"
          subject=$(jq -r '.[0].optional.Subject' "$output/cosign-verification.json")
          issuer=$(jq -r '.[0].optional.Issuer' "$output/cosign-verification.json")
          test "$subject" = "$EXPECTED_IDENTITY"
          test "$issuer" = "$ISSUER"
          jq -n \
            --arg extension "$EXTENSION" \
            --arg tag "$TAG" \
            --arg image "$image" \
            --arg digest "$digest" \
            --arg issuer "$issuer" \
            --arg subject "$subject" \
            '{extension:$extension,tag:$tag,image:$image,index_digest:$digest,issuer:$issuer,certificate_subject:$subject,verified:true}' \
            > "$output/summary.json"

      - name: Upload signature evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signature-${{ matrix.extension }}-${{ matrix.tag }}
          path: ${{ runner.temp }}/signature-evidence/${{ matrix.extension }}/${{ matrix.tag }}/
          if-no-files-found: error
          retention-days: 14
