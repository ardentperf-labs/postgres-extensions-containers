name: Universe scoped acceptance
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: universe-scoped-acceptance
  cancel-in-progress: false
jobs:
  authorize:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
      contents: read
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            if (context.ref !== 'refs/heads/main') throw new Error('Use the trusted main dispatcher');
            const {data: actor} = await github.rest.repos.getCollaboratorPermissionLevel({...context.repo, username: context.triggeringActor || process.env.GITHUB_TRIGGERING_ACTOR});
            if (actor.permission !== 'admin') throw new Error('Project admin required');
            const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: 4});
            if (pr.state !== 'open' || pr.head.sha !== '630f008749b08d46da4251061f30448056cbcaa8') throw new Error('Authorize the current PR head');
  contracts:
    needs: authorize
    permissions:
      contents: read
    uses: ardentperf-labs/postgres-extensions-containers/.github/workflows/source-build-tests.yml@630f008749b08d46da4251061f30448056cbcaa8
    with:
      ref: 630f008749b08d46da4251061f30448056cbcaa8
  duckdb:
    needs: authorize
    permissions:
      contents: read
      pull-requests: read
      actions: read
      packages: write
      id-token: write
      security-events: write
    uses: ardentperf-labs/postgres-extensions-containers/.github/workflows/source-build-targets.yml@630f008749b08d46da4251061f30448056cbcaa8
    with:
      pr_number: '4'
      ref: 630f008749b08d46da4251061f30448056cbcaa8
      extension_name: pg-duckdb
      build_family: universe
  pgrx:
    needs: authorize
    permissions:
      contents: read
      pull-requests: read
      actions: read
      packages: write
      id-token: write
      security-events: write
    uses: ardentperf-labs/postgres-extensions-containers/.github/workflows/source-build-targets.yml@630f008749b08d46da4251061f30448056cbcaa8
    with:
      pr_number: '4'
      ref: 630f008749b08d46da4251061f30448056cbcaa8
      extension_name: pg-durable
      build_family: pgrx
  debian:
    needs: authorize
    permissions:
      contents: read
      pull-requests: read
      actions: read
      packages: write
      id-token: write
      security-events: write
    uses: ardentperf-labs/postgres-extensions-containers/.github/workflows/bake_targets.yml@630f008749b08d46da4251061f30448056cbcaa8
    with:
      pr_number: '4'
      ref: 630f008749b08d46da4251061f30448056cbcaa8
      extension_name: debversion
