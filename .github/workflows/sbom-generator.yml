name: Probe new GHCR package visibility
on:
  workflow_dispatch:
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: First publication with workflow token and correct repository label
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          package="cnpg-visibility-probe-$GITHUB_RUN_ID"
          export PROBE_IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$package:test"
          mkdir -p "$RUNNER_TEMP/probe" "$RUNNER_TEMP/evidence"
          printf 'GHCR visibility test; no application payload.\n' > "$RUNNER_TEMP/probe/notice.txt"
          printf 'FROM scratch\nCOPY notice.txt /notice.txt\n' > "$RUNNER_TEMP/probe/Dockerfile"
          docker build --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$PROBE_IMAGE" "$RUNNER_TEMP/probe"
          docker push "$PROBE_IMAGE"
          gh api "orgs/$GITHUB_REPOSITORY_OWNER/packages/container/$package" \
            --jq '{name,visibility,created_at,repository: .repository.full_name}' \
            > "$RUNNER_TEMP/evidence/package.json"
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          from pathlib import Path
          image=os.environ['PROBE_IMAGE']; name=image.removeprefix('ghcr.io/').rsplit(':',1)[0]
          result={'image':image,'anonymous':True}
          try:
              url='https://ghcr.io/token?service=ghcr.io&scope=repository:'+name+':pull'
              with urllib.request.urlopen(url) as r: token=json.load(r)['token']
              result['token_http_status']=200
              request=urllib.request.Request('https://ghcr.io/v2/'+name+'/manifests/test',headers={
                  'Authorization':'Bearer '+token,'Accept':'application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json'})
              with urllib.request.urlopen(request) as r: result['manifest_http_status']=r.status
          except urllib.error.HTTPError as e:
              result['http_error']=e.code
          output=Path(os.environ['RUNNER_TEMP'])/'evidence/anonymous.json'
          output.write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ghcr-visibility-probe
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
