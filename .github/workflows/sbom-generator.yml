name: Build and publish SBOM generator

on:
  push:
    branches: [main]
    paths:
      - 'sbom-generator/**'
      - '.github/workflows/sbom-generator.yml'
  pull_request:
    paths:
      - 'sbom-generator/**'
      - '.github/workflows/sbom-generator.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a checked test image to GHCR (never updates latest)"
        required: false
        default: false
        type: boolean

permissions: {}

env:
  # renovate: datasource=docker depName=aquasec/trivy
  TRIVY_IMAGE: aquasec/trivy:0.69.3@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      SBOM_SMOKE_PLATFORM: linux/${{ matrix.arch }}
    permissions:
      contents: read
    concurrency:
      group: sbom-generator-check-${{ github.ref }}-${{ matrix.arch }}
      cancel-in-progress: true
    services:
      registry:
        # renovate: datasource=docker depName=registry
        image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports:
          - 5000:5000
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run tests
        run: |
          python3 -m venv "$RUNNER_TEMP/sbom-generator-venv"
          "$RUNNER_TEMP/sbom-generator-venv/bin/python" -m pip install \
            --requirement sbom-generator/requirements-validation.txt
          "$RUNNER_TEMP/sbom-generator-venv/bin/python" -m unittest discover \
            -s sbom-generator/tests -p 'test_*.py'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver-opts: network=host

      - name: Build local generator
        run: |
          docker buildx build --platform "$SBOM_SMOKE_PLATFORM" \
            --build-arg "SBOM_GENERATOR_REVISION=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --tag localhost:5000/cnpg-sbom-generator:check --push sbom-generator

      - name: Check BuildKit integration and license report
        env:
          PYTHON: ${{ runner.temp }}/sbom-generator-venv/bin/python
        run: bash sbom-generator/tests/integration/buildkit-smoke.sh localhost:5000/cnpg-sbom-generator:check "$RUNNER_TEMP/sbom-check"

      - name: Save check evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-generator-check-${{ matrix.arch }}
          path: ${{ runner.temp }}/sbom-check
          if-no-files-found: ignore

  publish:
    needs: check
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    concurrency:
      group: sbom-generator-publish
      cancel-in-progress: false
    services:
      registry:
        # renovate: datasource=docker depName=registry
        image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports:
          - 5000:5000
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver-opts: network=host

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select publication destination
        id: destination
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cnpg-sbom-generator" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" == push ]]; then alias="latest"; else alias="test"; fi
          echo "alias=$alias" >> "$GITHUB_OUTPUT"

      - name: Publish or reuse commit image
        env:
          IMAGE: ${{ steps.destination.outputs.image }}
        run: |
          python3 sbom-generator/release.py build \
            --image "$IMAGE" --revision "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY" \
            --output "$RUNNER_TEMP/sbom-release"

      - name: Check published digest with BuildKit
        env:
          IMAGE: ${{ steps.destination.outputs.image }}
          PYTHON: ${{ runner.temp }}/sbom-generator-venv/bin/python
        run: |
          python3 -m venv "$RUNNER_TEMP/sbom-generator-venv"
          "$PYTHON" -m pip install --requirement sbom-generator/requirements-validation.txt
          digest=$(cat "$RUNNER_TEMP/sbom-release/digest")
          bash sbom-generator/tests/integration/buildkit-smoke.sh "$IMAGE@$digest" "$RUNNER_TEMP/sbom-release/smoke"

      - name: Promote checked digest
        env:
          IMAGE: ${{ steps.destination.outputs.image }}
          ALIAS: ${{ steps.destination.outputs.alias }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 sbom-generator/release.py promote \
            --image "$IMAGE" --revision "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY" \
            --output "$RUNNER_TEMP/sbom-release" --alias "$ALIAS"

      - name: Summarize publication
        if: always()
        env:
          IMAGE: ${{ steps.destination.outputs.image }}
          ALIAS: ${{ steps.destination.outputs.alias }}
        run: |
          {
            echo '## SBOM generator publication'
            echo "Source: [$GITHUB_SHA](https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA)"
            echo 'Smoke-test architecture: linux/amd64; published platforms: linux/amd64 and linux/arm64.'
            if [[ -f "$RUNNER_TEMP/sbom-release/digest" ]]; then
              digest=$(cat "$RUNNER_TEMP/sbom-release/digest")
              echo "Commit artifact: \`$IMAGE:sha-$GITHUB_SHA@$digest\`"
              if [[ -f "$RUNNER_TEMP/sbom-release/promotion.json" ]] && jq -e '.promoted' "$RUNNER_TEMP/sbom-release/promotion.json" > /dev/null; then
                echo "Promoted reference: \`$IMAGE:$ALIAS@$digest\`"
              else
                echo "Alias $ALIAS was not promoted by this run. Check the job logs before using this artifact."
              fi
            fi
            echo "[Logs and evidence](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-generator-publication
          path: ${{ runner.temp }}/sbom-release
          if-no-files-found: ignore
