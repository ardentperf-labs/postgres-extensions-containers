name: Debian licensing regression matrix

on:
  workflow_dispatch:
    inputs:
      extensions:
        description: JSON array of core extension names to validate
        required: true
        type: string
        default: '["age","debversion","h3","hypopg","mobilitydb","mysql-fdw","pg-cron","pg-hint-plan","pg-partman","pg-qualstats","pg-rrule","pg-squeeze","pg-stat-kcache","pg-uuidv7","pgagent","pgmemcache","pgmp","pgsentinel","pgsphere","pldebugger","plpgsql-check","plprofiler","plr","q3c","snakeoil","tds-fdw","toastinfo"]'
      architectures:
        description: JSON array of native runner architectures
        required: true
        type: string
        default: '["amd64","arm64"]'
      generator:
        description: Pinned SBOM generator image reference
        required: true
        type: string
        default: 'ghcr.io/ardentperf-labs/cnpg-sbom-generator:latest@sha256:d7762114a3f906d8ba7a5ffcf611d9ea855a4d7fd18b46d3c2939d8d9c7eb135'
      core_source_commit:
        description: Core source commit represented by this validation branch
        required: true
        type: string
        default: 'd96725d676f07b090b9bd973572ee8e7cf9a04ea'
      verify_signatures:
        description: Verify corrected standard plr and pgsphere hosted signatures
        required: true
        type: boolean
        default: false

permissions: {}

jobs:
  build-and-verify:
    name: ${{ matrix.extension }} / linux/${{ matrix.arch }}
    if: ${{ !inputs.verify_signatures }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        extension: ${{ fromJSON(inputs.extensions) }}
        arch: ${{ fromJSON(inputs.architectures) }}
    steps:
      - name: Check out validation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 1

      - name: Expose the builder stage to the SBOM generator
        env:
          EXTENSION: ${{ matrix.extension }}
          ARCH: ${{ matrix.arch }}
        run: |
          python3 .github/workflows/apply_validation_overrides.py "$EXTENSION" "$ARCH"
          sed -i '2i ARG BUILDKIT_SBOM_SCAN_STAGE=builder' "$EXTENSION/Dockerfile"

      - name: Build the two distro targets with the current generator
        id: build
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7
        env:
          BUILDX_METADATA_PROVENANCE: disabled
          environment: testing
          registry: ghcr.io/${{ github.repository_owner }}/debian-licensing-validation
          revision: ${{ inputs.core_source_commit }}
          sbom_generator: ${{ inputs.generator }}
        with:
          source: .
          files: ./docker-bake.hcl,./${{ matrix.extension }}/metadata.hcl
          push: true
          set: '*.platform=linux/${{ matrix.arch }}'

      - name: Export SPDX and verify shipped files
        env:
          BUILD_METADATA: ${{ steps.build.outputs.metadata }}
          EXTENSION: ${{ matrix.extension }}
          ARCH: ${{ matrix.arch }}
          GENERATOR: ${{ inputs.generator }}
          CORE_SOURCE_COMMIT: ${{ inputs.core_source_commit }}
          VALIDATION_OVERRIDE: ${{ matrix.extension == 'plpgsql-check' && 'archive-pgdg-exact-pin-v1' || 'none' }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/licensing-evidence/$EXTENSION-$ARCH"
          mkdir -p "$output"
          printf '%s' "$BUILD_METADATA" > "$output/build-metadata.json"
          count=$(jq 'length' "$output/build-metadata.json")
          test "$count" -eq 2
          while IFS= read -r target; do
            image=$(jq -r --arg target "$target" '.[$target]["image.name"] | split(",")[0]' "$output/build-metadata.json")
            digest=$(jq -r --arg target "$target" '.[$target]["containerimage.digest"]' "$output/build-metadata.json")
            test -n "$image"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            distro=${target##*-}
            case "$distro" in bookworm|trixie) ;; *) echo "unexpected target: $target" >&2; exit 1 ;; esac
            sbom="$output/$distro.spdx.json"
            docker buildx imagetools inspect "$image@$digest" --format '{{json .SBOM.SPDX}}' > "$sbom"
            test -s "$sbom"
            docker pull --platform "linux/$ARCH" "$image@$digest"
            container=$(docker create "$image@$digest" /__verification_only_never_started__)
            docker export --output "$output/$distro.rootfs.tar" "$container"
            docker rm "$container" >/dev/null
            if python3 .github/workflows/debian_notice_verify.py \
              --sbom "$sbom" \
              --rootfs-tar "$output/$distro.rootfs.tar" \
              --extension "$EXTENSION" \
              --distro "$distro" \
              --arch "$ARCH" \
              --image "$image@$digest" \
              --output "$output/$distro-verification.json"; then
              :
            else
              status=$?
              rm -f "$output/$distro.rootfs.tar"
              exit "$status"
            fi
            rm "$output/$distro.rootfs.tar"
          done < <(jq -r 'keys[]' "$output/build-metadata.json")
          jq -s '{extension:env.EXTENSION,arch:env.ARCH,generator:env.GENERATOR,harness_commit:env.GITHUB_SHA,core_source_commit:env.CORE_SOURCE_COMMIT,validation_override:env.VALIDATION_OVERRIDE,cases:.}' "$output"/*-verification.json > "$output/summary.json"

      - name: Upload SPDX and filesystem evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: debian-license-${{ matrix.extension }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/licensing-evidence/${{ matrix.extension }}-${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 14

  verify-standard-signatures:
    if: ${{ inputs.verify_signatures }}
    runs-on: ubuntu-24.04
    permissions:
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - extension: plr
            tag: 1-8.4.8.7-202610020719-18-bookworm
          - extension: plr
            tag: 1-8.4.8.7-202610020719-18-trixie
          - extension: pgsphere
            tag: 1.5.2-202610020719-18-bookworm
          - extension: pgsphere
            tag: 1.5.2-202610020719-18-trixie
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify index signature and identity
        env:
          EXTENSION: ${{ matrix.extension }}
          TAG: ${{ matrix.tag }}
          ISSUER: https://token.actions.githubusercontent.com
          EXPECTED_IDENTITY: https://github.com/ardentperf-labs/postgres-extensions-containers/.github/workflows/bake_targets.yml@refs/heads/work/sbom-validation
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/signature-evidence/$EXTENSION/$TAG"
          mkdir -p "$output"
          image="ghcr.io/ardentperf-labs/$EXTENSION-testing:$TAG"
          printf 'image=%s\ntag=%s\nexpected_issuer=%s\nexpected_subject=%s\n' "$image" "$TAG" "$ISSUER" "$EXPECTED_IDENTITY" > "$output/inputs.txt"
          docker buildx imagetools inspect "$image" > "$output/manifest-inspect.txt"
          digest=$(awk '$1 == "Digest:" {print $2; exit}' "$output/manifest-inspect.txt" | tr -d '\r')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          reference="$image@$digest"
          cosign verify \
            --output=json \
            --certificate-oidc-issuer "$ISSUER" \
            "$reference" > "$output/issuer-verification.json"
          subject=$(jq -r '.[0].optional.Subject' "$output/issuer-verification.json")
          issuer=$(jq -r '.[0].optional.Issuer' "$output/issuer-verification.json")
          jq '[.[] | {issuer:.optional.Issuer,subject:.optional.Subject}]' "$output/issuer-verification.json" > "$output/certificate-identities.json"
          test "$subject" = "$EXPECTED_IDENTITY"
          test "$issuer" = "$ISSUER"
          cosign verify \
            --output=json \
            --certificate-oidc-issuer "$ISSUER" \
            --certificate-identity "$EXPECTED_IDENTITY" \
            "$reference" > "$output/identity-policy-verification.json"
          jq -n \
            --arg extension "$EXTENSION" \
            --arg tag "$TAG" \
            --arg image "$image" \
            --arg digest "$digest" \
            --arg issuer "$issuer" \
            --arg subject "$subject" \
            '{extension:$extension,tag:$tag,image:$image,index_digest:$digest,issuer:$issuer,certificate_subject:$subject,verified:true}' \
            > "$output/summary.json"

      - name: Upload signature evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signature-${{ matrix.extension }}-${{ matrix.tag }}
          path: ${{ runner.temp }}/signature-evidence/${{ matrix.extension }}/${{ matrix.tag }}/
          if-no-files-found: error
          retention-days: 14
