name: Build, test and publish extensions

on:
  push:
    paths-ignore:
      - 'pgrx/**'
      - 'docker-bake-pgrx.hcl'
      - '.github/workflows/pgrx.yml'
      - '.github/workflows/pgrx_targets.yml'
      - '.github/workflows/bake.yml'
      - '.github/workflows/sbom-generator.yml'
      - 'sbom-generator/**'
  workflow_dispatch:
    inputs:
      extension_name:
        description: "The PostgreSQL extension to build (directory name)"
        required: true
        type: string
      replay_cases:
        description: "Temporary PGRX smoke replay cases as a JSON array"
        required: true
        type: string

defaults:
  run:
    shell: 'bash -Eeuo pipefail -x {0}'

permissions: {}

jobs:
  # Gather extensions that have been modified
  change-triage:
    if: ${{ github.ref != 'refs/heads/validation/pgrx-smoke-replay' }}
    name: Check changed files
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.get-matrix.outputs.matrix}}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Fetch valid targets
        id: get-targets
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        env:
          # renovate: datasource=github-tags depName=dagger/dagger versioning=semver
          DAGGER_VERSION: 0.21.9
        with:
          version: ${{ env.DAGGER_VERSION }}
          verb: call
          module: ./dagger/maintenance/
          args: get-targets

      - name: Validate extension name
        if: github.event_name == 'workflow_dispatch'
        env:
          INPUT_EXTENSION_NAME: ${{ github.event.inputs.extension_name }}
          VALID_TARGETS: ${{ steps.get-targets.outputs.output }}
        run: |
          if ! echo "$VALID_TARGETS" | jq -e --arg ext "$INPUT_EXTENSION_NAME" 'index($ext)' > /dev/null; then
            echo "::error::'$INPUT_EXTENSION_NAME' is not a valid extension target. Valid targets: $VALID_TARGETS"
            exit 1
          fi

      - name: Compute paths-filter extensions block
        env:
          VALID_TARGETS: ${{ steps.get-targets.outputs.output }}
        run: |
          if ! echo "$VALID_TARGETS" | jq -e 'length > 0' > /dev/null; then
            echo "::error::dagger get-targets returned no extensions: $VALID_TARGETS"
            exit 1
          fi
          {
            echo 'EXTENSIONS<<YAML_EOF'
            echo "$VALID_TARGETS" | jq -r '.[] | "\(.):\n  - \"\(.)/**\"\n  - *shared"'
            echo 'YAML_EOF'
          } >> "$GITHUB_ENV"

      - name: Check for changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            _shared: &shared
              - 'docker-bake.hcl'
              - 'Taskfile.yml'
              - 'test/**'
              - 'dagger/maintenance/**'
              - '.github/workflows/bake_targets.yml'
            ${{ env.EXTENSIONS }}

      # Compute a matrix containing the list of all extensions that have been modified
      - name: Compute matrix
        id: get-matrix
        env:
          # JSON array containing the extensions that have been changed
          CHANGES: ${{ steps.filter.outputs.changes }}
          # Input Extension name
          INPUT_EXTENSION_NAME: ${{ github.event.inputs.extension_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "${EVENT_NAME}" == 'workflow_dispatch' ]]; then
            CHANGES="[\"$INPUT_EXTENSION_NAME\"]"
          fi

          # Filter away the shared filter
          EXTENSIONS_CHANGED=$(echo "$CHANGES" | jq -c 'map(select(. != "_shared"))')

          echo "matrix=$EXTENSIONS_CHANGED" >> "$GITHUB_OUTPUT"

  Bake:
    name: Bake
    needs: change-triage
    permissions:
      packages: write
      contents: read
      id-token: write
      security-events: write
    if: ${{ join(fromJSON(needs.change-triage.outputs.matrix)) != '' && github.ref != 'refs/heads/validation/pgrx-smoke-replay' }}
    strategy:
      fail-fast: false
      matrix:
        extension: ${{ fromJSON(needs.change-triage.outputs.matrix) }}
    uses: ./.github/workflows/bake_targets.yml
    with:
      extension_name: ${{ matrix.extension }}
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  pgrx-smoke-replay:
    name: Replay PGRX smoke (${{ matrix.case.extension }}, ${{ matrix.case.target }}, CNPG ${{ matrix.cnpg }})
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/validation/pgrx-smoke-replay' && inputs.replay_cases != '[]' }}
    runs-on: ubuntu-24.04-arm
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        cnpg: ['1.30']
        case: ${{ fromJSON(inputs.replay_cases) }}
    steps:
      - name: Check out replay harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: replay-harness
          persist-credentials: false
      - name: Check out exact PGRX source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: f3d0af65b9e1a8fd97b1b364c94fe9a699f252a1
          path: pgrx-source
          persist-credentials: false
      - name: Install pinned workflow tools
        working-directory: pgrx-source
        run: python3 pgrx/bootstrap_workflow_tools.py --output "$RUNNER_TEMP/pgrx-bin"
      - name: Download prepared inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: prepared-${{ matrix.case.extension }}
          path: ${{ runner.temp }}/prepared
          run-id: ${{ matrix.case.artifact_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download assembled image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: assembly-${{ matrix.case.target }}
          path: ${{ runner.temp }}/assembly
          run-id: ${{ matrix.case.artifact_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare the external ARM smoke overlay
        run: |
          python3 "$GITHUB_WORKSPACE/replay-harness/.github/pgrx-smoke-adapter/prepare.py" \
            --source "$GITHUB_WORKSPACE/pgrx-source/pgrx/smoke.py" \
            --source-root "$GITHUB_WORKSPACE/pgrx-source" \
            --output "$RUNNER_TEMP/pgrx-smoke-overlay"
      - name: Replay signed ARM image smoke
        env:
          PGRX_SOURCE_ROOT: ${{ github.workspace }}/pgrx-source
          PGRX_SMOKE_OVERLAY: ${{ runner.temp }}/pgrx-smoke-overlay
          PGRX_SMOKE_PLATFORM: linux/arm64
        run: |
          GITHUB_REF=refs/heads/work/pgrx-validation python3 \
            "$GITHUB_WORKSPACE/replay-harness/.github/pgrx-smoke-adapter/run.py" smoke \
            --preparation "$RUNNER_TEMP/prepared" \
            --assembly "$RUNNER_TEMP/assembly" \
            --expected-extension "${{ matrix.case.extension }}" \
            --expected-target "${{ matrix.case.target }}" \
            --expected-run-id "${{ matrix.case.build_run_id }}" \
            --cnpg-version "${{ matrix.cnpg }}" \
            --output "$RUNNER_TEMP/smoke-result"
      - name: Upload smoke result
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pgrx-smoke-replay-${{ matrix.case.target }}-cnpg-${{ matrix.cnpg }}
          path: |
            ${{ runner.temp }}/smoke-result/runtime.json
            ${{ runner.temp }}/smoke-result/fixtures.json
            ${{ runner.temp }}/smoke-result/result.json
            ${{ runner.temp }}/smoke-result/adapter.json
          if-no-files-found: ignore

  automerge-gate:
    name: Automerge gate
    if: ${{ always() && github.ref != 'refs/heads/validation/pgrx-smoke-replay' }}
    needs:
      - change-triage
      - Bake
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Verify build and test results
        if: >-
          ${{
            needs.change-triage.result != 'success' ||
            (
              needs.Bake.result != 'success' &&
              needs.Bake.result != 'skipped'
            )
          }}
        run: |
          echo "CI failed:"
          echo "change-triage: ${{ needs.change-triage.result }}"
          echo "Bake: ${{ needs.Bake.result }}"
          exit 1

      - name: Checkout Renovate changes
        if: startsWith(github.ref, 'refs/heads/renovate/')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check Renovate versions for prereleases
        if: startsWith(github.ref, 'refs/heads/renovate/')
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Real examples: MobilityDB 1.3.0-alpha, HypoPG 2.0.0beta,
          # pg_partman 5.3.0RC1, MobilityDB 1.3.0~rc1-1.pgdg13+1.
          # Dockerfiles use EXT_VERSION from metadata and have no Renovate annotations.
          for FILE in */metadata.hcl */README.md; do
            DIFF=$(git diff --no-ext-diff --no-color --unified=2 "origin/$DEFAULT_BRANCH"...HEAD -- "$FILE")
            # Every metadata/README annotation is directly above its value; -A2
            # includes both the removed (-) and replacement (+) value lines.
            if grep -EA2 '^[ +][[:space:]]*(//|#) renovate:' <<< "$DIFF" |
               grep '^\+' |
               grep -Ei 'alpha|beta|rc|~'; then
              # AGE final releases retain rc in their version names.
              # https://github.com/apache/age/releases/tag/PG18/v1.8.0-rc0
              if [[ "${FILE%%/*}" == age ]]; then
                continue
              fi
              echo "::error file=$FILE::Renovate changed a version containing alpha, beta, rc, or ~ (see the added lines above). These markers can indicate an unstable prerelease, so the Automerge gate is failing to prevent automatic approval/merge. Before approving this PR, verify from the upstream release announcement that this exact version is a final production release. If it is a prerelease, use a stable version or close the update. If the marker is part of a confirmed final release's naming convention, document the evidence and add a narrowly scoped exception to this check, then rerun CI; approval alone does not clear the failed gate."
              exit 1
            fi
          done

      - name: CI passed
        run: echo "All required CI passed"

  Catalogs:
    name: Update Catalogs
    needs: Bake
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Repository Dispatch
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4
        with:
          event-type: update-catalogs
