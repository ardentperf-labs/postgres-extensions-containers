apiVersion: v1
kind: ConfigMap
metadata:
  name: functional-sql
data:
  functional.sql: "\\set ON_ERROR_STOP on\nCREATE TABLE rewrite_probe(id integer PRIMARY\
    \ KEY, value text);\nINSERT INTO rewrite_probe VALUES (1,'preserved');\nCREATE\
    \ TABLE rewrite_new(id bigint PRIMARY KEY, value text);\nSELECT rewrite_table('rewrite_probe','rewrite_new','rewrite_old');\n\
    DO $$ BEGIN\n IF (SELECT value FROM rewrite_probe WHERE id=1) IS DISTINCT FROM\
    \ 'preserved' THEN RAISE EXCEPTION 'rewritten data mismatch'; END IF;\n IF (SELECT\
    \ atttypid FROM pg_attribute WHERE attrelid='rewrite_probe'::regclass AND attname='id')\
    \ IS DISTINCT FROM 'bigint'::regtype THEN RAISE EXCEPTION 'table was not rewritten';\
    \ END IF;\nEND $$;\nDROP TABLE rewrite_old;\n"
