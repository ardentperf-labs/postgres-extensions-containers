apiVersion: v1
kind: ConfigMap
metadata:
  name: functional-sql
data:
  functional.sql: "\\set ON_ERROR_STOP on\nSET credcheck.password_min_length = 12;\n\
    DO $$ BEGIN\n BEGIN\n  EXECUTE 'CREATE ROLE weak_password_probe LOGIN PASSWORD\
    \ ''short''';\n  RAISE EXCEPTION 'weak password accepted';\n EXCEPTION WHEN invalid_authorization_specification\
    \ THEN\n  IF position('credcheck.password_min_length' in SQLERRM) = 0 THEN RAISE;\
    \ END IF;\n END;\nEND $$;\nCREATE ROLE strong_password_probe LOGIN PASSWORD 'Safe-long-password-42!';\n\
    DROP ROLE strong_password_probe;\n"
