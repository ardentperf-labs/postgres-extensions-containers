apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: verify-extension
spec:
  # Wait for the Cluster's pods before deleting their namespace.
  deletionPropagationPolicy: Foreground
  timeouts:
    apply: 5s
    assert: 3m
    delete: 30s
    # Background workers can retain connections through CNPG's 180s smart
    # shutdown window. Allow the subsequent fast shutdown and namespace cleanup.
    cleanup: 5m
  description: >-
    Validates the end-to-end lifecycle of a PostgreSQL extension, including cluster
    initialization, database resource creation, and functional verification.
  catch:
  - events: {}
  - get:
      apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      format: yaml
  - get:
      apiVersion: postgresql.cnpg.io/v1
      kind: Database
      format: yaml
  - get:
      apiVersion: postgresql.cnpg.io/v1
      kind: ClusterImageCatalog
      name: ($values.catalog.metadata.name)
      format: yaml
  - get:
      apiVersion: v1
      kind: Pod
      format: yaml
  - podLogs:
      selector: (join('', ['cnpg.io/cluster=', $values.name]))
      tail: 200
  - podLogs:
      selector: job-name=extension-installed
      tail: 200
  steps:
  - name: Provision PostgreSQL Cluster
    description: >-
      Deploy a Cluster resource using the built extension container image. 
      This step validates that the custom image is compatible with the operator 
      and that the instance can initialize and reach a Healthy phase.
    try:
    - apply:
        file: candidate-catalog.yaml
    - apply:
        file: cluster.yaml
    - assert:
        file: cluster-assert.yaml
    - assert:
        file: candidate-pod-assert.yaml

  - name: Initialize Database and Extension
    description: Create the Database custom resource and trigger the 'CREATE EXTENSION' logic via CNPG.
    try:
    - apply:
        file: database.yaml
    - assert:
        timeout: 30s
        file: database-assert.yaml

  - name: Functional Verification
    description: >-
      Execute a SQL-level check against pg_extension to confirm the extension 
      is successfully registered in the database catalog.
    try:
    - apply:
        file: check-extension.yaml
    - assert:
        timeout: 30s
        file: check-extension-assert.yaml

