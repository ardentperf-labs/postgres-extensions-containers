apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: upstream-extension-tests
spec:
  timeouts:
    apply: 5s
    assert: 3m
    delete: 30s
  description: >-
    Provisions a CloudNativePG Cluster with the built extension image mounted.
    Upstream tests are run separately by the Dagger harness.
  steps:
  - name: Provision PostgreSQL Cluster
    try:
    - apply:
        file: cluster.yaml
    - assert:
        file: cluster-assert.yaml
