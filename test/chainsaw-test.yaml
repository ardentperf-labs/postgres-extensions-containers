apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: upstream-extension-tests
spec:
  # Wait for the Cluster's pods before deleting their namespace.
  deletionPropagationPolicy: Foreground
  timeouts:
    apply: 5s
    assert: 3m
    delete: 30s
    # Background workers can retain connections through CNPG's 180s smart
    # shutdown window. Allow the subsequent fast shutdown and namespace cleanup.
    cleanup: 5m
  description: >-
    Provisions a CloudNativePG Cluster with the built extension image mounted.
    Upstream tests are run separately by the Dagger harness.
  steps:
  - name: Provision PostgreSQL Cluster
    try:
    - apply:
        file: cluster.yaml
    - assert:
        file: cluster-assert.yaml
