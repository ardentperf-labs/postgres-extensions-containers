apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: functional-extension
spec:
  timeouts:
    apply: 30s
    assert: 5m
    delete: 30s
  description: Provisions the CNPG extension image and checks useful SQL behavior.
  steps:
  - name: Start MongoDB fixture
    try:
    - apply:
        file: fixture.yaml
    - assert:
        file: fixture-assert.yaml
  - name: Seed MongoDB collection
    try:
    - apply:
        file: seed-job.yaml
    - assert:
        file: seed-job-assert.yaml
    catch:
    - podLogs:
        selector: job-name=seed-mongo
        tail: 60
    - events: {}
  - name: Provision Cluster
    try:
    - apply:
        file: cluster.yaml
    - assert:
        file: cluster-assert.yaml
  - name: Install extension
    try:
    - apply:
        file: database.yaml
    - assert:
        file: database-assert.yaml
  - name: Read MongoDB collection through FDW
    try:
    - apply:
        file: functional-job.yaml
    - assert:
        file: functional-job-assert.yaml
    catch:
    - podLogs:
        selector: job-name=functional-check
        tail: 60
    - events: {}
