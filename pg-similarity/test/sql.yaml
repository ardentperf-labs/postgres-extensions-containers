apiVersion: v1
kind: ConfigMap
metadata:
  name: functional-sql
data:
  functional.sql: "\\set ON_ERROR_STOP on\nDO $$ BEGIN\n IF lev('kitten','kitten')\
    \ IS DISTINCT FROM 1 THEN RAISE EXCEPTION 'identity similarity failed'; END IF;\n\
    \ IF lev('kitten','sitting') IS NULL OR lev('kitten','sitting') >= 1 THEN RAISE\
    \ EXCEPTION 'different strings matched exactly'; END IF;\nEND $$;\n"
