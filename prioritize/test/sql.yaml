apiVersion: v1
kind: ConfigMap
metadata:
  name: functional-sql
data:
  functional.sql: "\\set ON_ERROR_STOP on\nDO $$ DECLARE before_priority integer;\
    \ BEGIN\n before_priority := get_backend_priority(pg_backend_pid());\n IF NOT\
    \ set_backend_priority(pg_backend_pid(), least(19,before_priority+1)) THEN RAISE\
    \ EXCEPTION 'priority update failed'; END IF;\n IF get_backend_priority(pg_backend_pid())\
    \ IS DISTINCT FROM least(19,before_priority+1) THEN RAISE EXCEPTION 'priority\
    \ unchanged'; END IF;\nEND $$;\n"
