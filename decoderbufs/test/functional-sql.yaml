apiVersion: v1
kind: ConfigMap
metadata:
  name: functional-sql
data:
  functional.sql: "\\set ON_ERROR_STOP on\nCREATE TABLE public.decoderbufs_fixture(id\
    \ integer PRIMARY KEY, value text NOT NULL);\nALTER TABLE public.decoderbufs_fixture\
    \ REPLICA IDENTITY FULL;\nSELECT slot_name FROM pg_create_logical_replication_slot('decoderbufs_fixture',\
    \ 'decoderbufs');\nINSERT INTO public.decoderbufs_fixture VALUES (1, 'decoderbufs-insert-probe');\n\
    UPDATE public.decoderbufs_fixture SET value = 'decoderbufs-update-probe' WHERE\
    \ id = 1;\nDELETE FROM public.decoderbufs_fixture WHERE id = 1;\nCREATE TEMP TABLE\
    \ decoded_debug AS\n SELECT data FROM pg_logical_slot_peek_changes('decoderbufs_fixture',\
    \ NULL, NULL, 'debug-mode', '1');\nDO $$ BEGIN\n IF NOT EXISTS (SELECT FROM decoded_debug\
    \ WHERE data LIKE '%table[public.decoderbufs_fixture], op[0]%' AND data LIKE '%datum[decoderbufs-insert-probe]%')\n\
    \ OR NOT EXISTS (SELECT FROM decoded_debug WHERE data LIKE '%table[public.decoderbufs_fixture],\
    \ op[1]%' AND data LIKE '%datum[decoderbufs-update-probe]%')\n OR NOT EXISTS (SELECT\
    \ FROM decoded_debug WHERE data LIKE '%table[public.decoderbufs_fixture], op[2]%'\
    \ AND data LIKE '%datum[decoderbufs-update-probe]%') THEN\n  RAISE EXCEPTION 'decoderbufs\
    \ did not decode INSERT/UPDATE/DELETE with their values';\n END IF;\nEND $$;\n\
    CREATE TEMP TABLE decoded_binary AS\n SELECT data FROM pg_logical_slot_get_binary_changes('decoderbufs_fixture',\
    \ NULL, NULL);\nDO $$ BEGIN\n IF (SELECT count(*) FROM decoded_binary) < 9\n OR\
    \ NOT EXISTS (SELECT FROM decoded_binary WHERE position(convert_to('decoderbufs-insert-probe',\
    \ 'UTF8') in data) > 0)\n OR NOT EXISTS (SELECT FROM decoded_binary WHERE position(convert_to('decoderbufs-update-probe',\
    \ 'UTF8') in data) > 0) THEN\n  RAISE EXCEPTION 'decoderbufs binary protobuf messages\
    \ lack transaction records or values';\n END IF;\nEND $$;\nSELECT pg_drop_replication_slot('decoderbufs_fixture');\n\
    DROP TABLE public.decoderbufs_fixture;\n"
