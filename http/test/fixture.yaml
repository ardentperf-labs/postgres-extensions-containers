apiVersion: v1
kind: ConfigMap
metadata:
  name: http-fixture
data:
  index.html: |
    pg-http-fixture-ok
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: http-fixture
spec:
  replicas: 1
  selector:
    matchLabels:
      app: http-fixture
  template:
    metadata:
      labels:
        app: http-fixture
    spec:
      containers:
      - name: nginx
        # renovate: datasource=docker depName=nginx versioning=docker
        image: nginx:1.29.1-alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: content
          mountPath: /usr/share/nginx/html
          readOnly: true
      volumes:
      - name: content
        configMap:
          name: http-fixture
---
apiVersion: v1
kind: Service
metadata:
  name: http-fixture
spec:
  selector:
    app: http-fixture
  ports:
  - port: 80
    targetPort: 80
