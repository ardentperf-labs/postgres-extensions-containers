apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ($values.name)
spec:
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: (regex_replace_all('^.*minimal-', $values.pg_image, 'postgresql-minimal-'))
    major: 18
  enableSuperuserAccess: true
  instances: 1

  storage:
    size: 1Gi

  postgresql:
    parameters:
      pg_rage_terminator.chance: "100"
      pg_rage_terminator.interval: "1"
    shared_preload_libraries: ($values.shared_preload_libraries)
    extensions: ($values.extensions)
