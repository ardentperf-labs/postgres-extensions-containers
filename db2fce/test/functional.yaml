apiVersion: batch/v1
kind: Job
metadata:
  name: extension-functional-check
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: sql-check
        # renovate: datasource=docker depName=alpine/psql versioning=docker
        image: alpine/psql:18.6@sha256:794901afa39b7f80d8245a6d8fa9aaf987380e4b7a6d0be22d404194352e8c17
        env:
          - name: PGSSLROOTCERT
          - name: DB_URI
            valueFrom:
              secretKeyRef:
                name: (join('-', [$values.name, 'app']))
                key: uri
          - name: TEST_SQL
            value: "SELECT db2.year(date '2026-09-29') = 2026"
        command: ['sh', '-c']
        args:
          - |
            set -eu
            DB_URI=$(printf '%s' "$DB_URI" | sed "s|/\*|/|")
            ready=false
            for attempt in $(seq 1 60); do
              if pg_isready -q -d "$DB_URI"; then ready=true; break; fi
              sleep 1
            done
            test "$ready" = true
            result=$(psql "$DB_URI" -X -v ON_ERROR_STOP=1 -Atq -c "$TEST_SQL")
            test "$result" = t
            echo "functional SQL returned true: $result"
